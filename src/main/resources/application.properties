spring.application.name=redCake

# RedCake is a plain TCP server, not a web application. Without this, Spring
# Boot would start an embedded HTTP server on port 8080 if one were on the classpath.
spring.main.web-application-type=none

# Startup banner is noise for a database process; logs stay readable.
spring.main.banner-mode=off

# Log pattern: time level thread logger - message. Raise to DEBUG for
# connection-level diagnostics (client disconnects, timeouts).
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
logging.level.me.niteshh.redcake=INFO
